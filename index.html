<style type="text/css">
.red_btn{background-image: linear-gradient(to left,  white,red);}
.orange_btn{background-image: linear-gradient(to left,  white,orange);}
.yellow_btn{background-image: linear-gradient(to left,  white,yellow);}

.gridlayout
{
    display: grid;
    grid-template-columns: 70px 720px;
    padding: 1px;
}
.gltots
{
    display: grid;
    grid-template-columns: 70px 320px 70px 300px;
    padding: 1px;
}
.Cmd
{
    width: 230px;
    display: grid;
    grid-template-columns: 70px 70px 70px;
    padding: 2px;
    margin: 0px 12px;
    gap: 5px;
    background-color: #fac0c0;
}

.Totc1
{
    text-align: right;
    margin-bottom: 2px;
    margin-top: 2px;
    font-size: medium;
    font-weight: bold;
    color: #00dfdd;
    padding-right: 4px;
    border: 1px solid #000088;
    vertical-align: middle;
    background-color: #000;
    background-image: linear-gradient(to left,  white,black);
    text-shadow: 1px 1px 1px #000;
}
    .Totc1t
    {
        text-align: right;
        margin-bottom: 2px;
        margin-top: 2px;
        font-size: medium;
        font-weight: bold;
        color: #0000f6;
        padding-right: 4px;
        border: 1px solid #000088;
        vertical-align: middle;
        background-color: #e6e6e6;
        background-image: linear-gradient(to left,  white,#e6e6e6);
        text-shadow: 1px 1px 1px white;
    }

.Totc2
{
    text-align: left;
    margin-bottom: 2px;
    margin-top: 2px;
    font-size: medium;
    font-weight: bold;
    color: #00d0dd;
    padding-left: 4px;
    border: 1px solid #000088;
    vertical-align: middle;
    background-color: #000;
    background-image: linear-gradient(to left,white, black );
    text-shadow: 1px 1px 1px white;
}
    .Totc2t
    {
        text-align: left;
        margin-bottom: 2px;
        margin-top: 2px;
        font-size: medium;
        font-weight: bold;
        color: #ffff00;
        padding-left: 4px;
        border: 1px solid #000088;
        vertical-align: middle;
        background-color: #262626;
        background-image: linear-gradient(to left,white,#262626);
        text-shadow: 1px 1px 1px #000;
    }
.item
{
    font-family: Corbel;
    text-align: left;
    font-weight: bold;
    border: 1px solid #C0C0C0;
    vertical-align: middle;
}

h1
{
    text-align: center;
    font-family: Corbel;
}

.Light
{
    font-size: medium;
    font-style: normal;
    color: blue;
    background-color: lightyellow;
    background-image: linear-gradient(to left,white,lightyellow);
    text-align: right;
    padding-right: 4px;
}

.Dark
{
    font-size: medium;
    font-weight: bold;
    color: darkblue;
    text-align: right;
    padding-right: 4px;
}

.Black
{
    font-size: medium;
    font-weight: bold;
    color: #000;
    padding-left: 4px;
}

.Blue
{
    font-size: medium;
    font-style: italic;
    background-color: lightyellow;
    color: #0000FF;
    text-align: center;
    background-image: linear-gradient(to left,white, lightyellow);

}

.g
{
    color: white;
    background-color:darkgreen;
    text-shadow: 1px 1px 1px cyan;
    background-image: linear-gradient(to left, darkgreen, white);
}

.IU
{
    color: white;
    background-color:#ff00dc;
    background-image: linear-gradient(to left, #ff00dc, white);
}

.kcal, .kJ
{
    color: white;
    background-color:red;
    background-image: linear-gradient(to left, red, white);
}

.mg
{
    color: white;
    background-image: linear-gradient(to left, #de620a, white);
}

.µg
{
    color: white;
    background-color:#0094ff;
    background-image: linear-gradient(to left, #0094ff, white);
}

function addDiv(frag, val, clss)
{
    const col = document.createElement('div');
    col.textContent = val;
    col.className = clss;
    frag.appendChild(col);
    console.log(val + "  " + clss);

}//addDiv

    actList = document.querySelectorAll('input');

    });

    var p000 = document.getElementById('p000');

        var p000 = document.getElementById('p000');

            const headFrag = document.createDocumentFragment();
            //
            let xUnit = x.NutrHeadingRow.Unit;
            let xContent = xUnit;
            let xClass = xUnit + " item Light";
            //
            let yContent = x.NutrHeadingRow.Nut_Name;

            }//for
            if (atLeast_1Row > 0) {
                p000.appendChild(headFrag);
                p000.appendChild(dataFrag);
            }

        }

        var tdp;
        ///
        const dataFrag = document.createDocumentFragment();
        var t_sum = 0;
        ///
        var atLeast_1Row = 0;
        var isTotal = 0;
        //
        for (var n = 0; n < x.foodlist.length; n++) {
            var foo = x.foodlist[n];
            var FoodId = foo.Name;
           
            var pc; // = getPort(foo.NDB);
            if(foo.Val > 0)
                atLeast_1Row++;
            if (parseInt(foo.NDB) > 0)
            {
                tdp = dp;
                pc = getPort(foo.NDB);
                oVal = (pc * foo.Val);
                t_sum += oVal;

            } //if
            else {
                //if NDB == 0 its totals.
                isTotal = 1;
                noColCss = "Totc1t";
                nameColCss = "Totc2t";
                tdp = dp + 1;
                oVal = t_sum;
                //Add the Number of row so far too
                FoodId =  " [ " + atLeast_1Row + " foods ] ";

            } //else

            //
            if (oVal > 0) {
                if (isTotal > 0) {
                    addDiv(dataFrag, oVal.toFixed(tdp), noColCss);
                    addDiv(dataFrag, FoodId, nameColCss);
                    atLeast_1Row++;
                }

     

            } //if

        } //for
        if (atLeast_1Row > 0) {
            p000.appendChild(headFrag);
            p000.appendChild(dataFrag);
        }

    }
} //go done....
